name: Launch film CI

on:
  push:
    branches:
      - kryxai-launch-film
    paths:
      - "launch-video/**"
      - ".github/workflows/launch-film.yml"
  pull_request:
    paths:
      - "launch-video/**"
      - ".github/workflows/launch-film.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launch-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launch-video/package.json
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Render launch film
        run: npm run render
      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: kryxai-launch-film
          path: launch-video/out/kryxai-launch.mp4
          if-no-files-found: error
          retention-days: 30
