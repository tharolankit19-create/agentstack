name: Build Kryx device installers

on:
  push:
    branches:
      - kryx-desktop-v1-2
    paths:
      - "apps/android/**"
      - "apps/desktop/**"
      - ".github/workflows/build-device-installers.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/desktop/**"
      - ".github/workflows/build-device-installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android tablet APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile installable APK
        run: gradle -p apps/android :app:assembleDebug --stacktrace

      - name: Package APK and checksum
        run: |
          mkdir -p artifacts/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk artifacts/android/Kryx-Tablet-1.2.0-dev-signed.apk
          cd artifacts/android
          sha256sum Kryx-Tablet-1.2.0-dev-signed.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kryx-android-tablet
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Build DMG and ZIP
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Package checksums
        run: |
          mkdir -p artifacts/macos
          DMG="$(find apps/desktop/dist -maxdepth 1 -name "*.dmg" | head -n 1)"
          ZIP="$(find apps/desktop/dist -maxdepth 1 -name "*.zip" | head -n 1)"
          test -f "$DMG"
          test -f "$ZIP"
          cp "$DMG" artifacts/macos/Kryx-Mac-1.2.0-preview.dmg
          cp "$ZIP" artifacts/macos/Kryx-Mac-1.2.0-preview.zip
          cd artifacts/macos
          shasum -a 256 Kryx-Mac-1.2.0-preview.dmg Kryx-Mac-1.2.0-preview.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kryx-macos
          path: artifacts/macos/*
          if-no-files-found: error
          retention-days: 14


  publish-preview:
    name: Publish direct-download preview
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kryx-android-tablet
          path: release/android

      - uses: actions/download-artifact@v4
        with:
          name: kryx-macos
          path: release/macos

      - name: Publish stable preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: kryx-device-latest
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Kryx device preview" \
              --notes "Installable Kryx device preview. Android is development-signed. macOS is unsigned/notarization-pending. Production signing credentials are intentionally not stored in source." \
              --prerelease
          fi

          cp release/android/SHA256SUMS.txt release/android/android-SHA256SUMS.txt
          cp release/macos/SHA256SUMS.txt release/macos/macos-SHA256SUMS.txt

          gh release upload "$TAG" \
            release/android/Kryx-Tablet-1.2.0-dev-signed.apk \
            release/android/android-SHA256SUMS.txt \
            release/macos/Kryx-Mac-1.2.0-preview.dmg \
            release/macos/Kryx-Mac-1.2.0-preview.zip \
            release/macos/macos-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
