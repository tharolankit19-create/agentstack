name: Build Kryx device installers

on:
  push:
    branches:
      - kryx-desktop-v1-2
    paths:
      - "apps/android/**"
      - "apps/desktop/**"
      - ".github/workflows/build-device-installers.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/desktop/**"
      - ".github/workflows/build-device-installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android tablet APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile installable APK
        run: gradle -p apps/android :app:assembleDebug --stacktrace

      - name: Package APK and checksum
        run: |
          mkdir -p artifacts/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk artifacts/android/Kryx-Tablet-1.2.0-dev-signed.apk
          cd artifacts/android
          sha256sum Kryx-Tablet-1.2.0-dev-signed.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kryx-android-tablet
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Build DMG and ZIP
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Package checksums
        run: |
          mkdir -p artifacts/macos
          find apps/desktop/dist -maxdepth 1 \( -name "*.dmg" -o -name "*.zip" \) -exec cp {} artifacts/macos/ \;
          cd artifacts/macos
          shasum -a 256 * > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kryx-macos
          path: artifacts/macos/*
          if-no-files-found: error
          retention-days: 14
