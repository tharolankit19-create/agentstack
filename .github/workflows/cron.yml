name: Agent schedules

# The army's heartbeat, driven from GitHub instead of Vercel.
#
# Vercel's Hobby (free) plan caps cron jobs at two and runs them only once a
# day — no good for "at 5pm do X and message me", which needs a trigger every
# few minutes, nor for an hourly briefing. GitHub Actions runs scheduled
# workflows for free, so this is what actually wakes the cron endpoints. Each
# call carries the same CRON_SECRET the app checks, sent as a Bearer token, so
# nobody but this workflow can trigger the work.
#
# Setup (one time):
#   1. Vercel → Project → Settings → Environment Variables → add CRON_SECRET.
#   2. GitHub → repo → Settings → Secrets and variables → Actions:
#        - New repository secret: CRON_SECRET  (the SAME value as in Vercel)
#        - Optional repository variable: APP_URL (defaults to the live URL below)
#
# GitHub may delay scheduled runs by a few minutes under load — fine for a
# briefing or a 5pm task, and the task endpoint is idempotent, so a late or
# doubled run never does the work twice.

on:
  schedule:
    - cron: "*/15 * * * *" # scheduled tasks — the "do it at 5pm" queue
    - cron: "0 * * * *" #    hourly — daily briefing decides if it's due
    - cron: "0 */3 * * *" #  every 3 hours — research pulse
    - cron: "0 3 * * *" #    daily 03:00 UTC — playbook rollup
  # A manual button, so you can fire any endpoint on demand to test it.
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Which endpoint to hit (tasks | briefing | research | playbook)"
        required: true
        default: "tasks"

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://agentstack-web-chi.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Guard — secret must be set
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set. Add it under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      # One reusable call. Fails the step on any non-2xx so a broken schedule is
      # visible in the Actions tab instead of failing silently.
      - name: Call endpoint
        run: |
          set -euo pipefail

          hit() {
            local path="$1"
            echo "→ $APP_URL$path"
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL$path")
            echo "  HTTP $code"
            cat /tmp/body.txt; echo
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "Endpoint $path returned $code" >&2
              exit 1
            fi
          }

          # A manual run hits exactly the endpoint you picked.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            hit "/api/cron/${{ github.event.inputs.endpoint }}"
            exit 0
          fi

          # A scheduled run hits the endpoint that matches the cron that fired.
          case "${{ github.event.schedule }}" in
            "*/15 * * * *") hit "/api/cron/tasks" ;;
            "0 * * * *")    hit "/api/cron/briefing" ;;
            "0 */3 * * *")  hit "/api/cron/research" ;;
            "0 3 * * *")    hit "/api/cron/playbook" ;;
            *) echo "No mapping for schedule '${{ github.event.schedule }}'" >&2; exit 1 ;;
          esac
