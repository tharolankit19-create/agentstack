name: Kryx operator verification
on:
  pull_request:
  push:
    branches: [codex/kryx-persistent-operator, main]
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playwright
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kryx-product-evidence
          path: |
            docs/operator/screenshots/
            test-results/
  runtime-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kryx-computer:local apps/computer-runtime
      - run: docker compose -f apps/computer-runtime/compose.yaml config --quiet
        env:
          KRYX_COMPUTER_API_KEY: ci-configuration-check-only-32-characters
          KRYX_ALLOWED_DOMAINS: '["example.com"]'
